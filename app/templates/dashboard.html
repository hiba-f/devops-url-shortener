<!DOCTYPE html>
<html>

<head>

    <title>Analytics Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #2c3e50;
        }

        .stats {
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th {
            background: #007bff;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        canvas {
            margin-top: 30px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Analytics Dashboard</h1>

        <div class="stats">

            <h2>Short Code: {{ short_code }}</h2>

            <h2>Total Clicks: {{ clicks }}</h2>

        </div>

        <canvas id="clickChart"></canvas>

        <table>

            <tr>
                <th>Browser</th>
                <th>Timestamp</th>
            </tr>

            {% for item in analytics %}

            <tr>
                <td>{{ item.browser }}</td>
                <td>{{ item.timestamp }}</td>
            </tr>

            {% endfor %}

        </table>

    </div>

    <script>

        const ctx = document.getElementById('clickChart');

        new Chart(ctx, {

            type: 'bar',

            data: {

                labels: ['Clicks'],

                datasets: [{
                    label: 'Total Clicks',
                    data: [{ clicks }],
                    borderWidth: 1
                }]
            },

            options: {

                scales: {

                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

    </script>

</body>

</html>
